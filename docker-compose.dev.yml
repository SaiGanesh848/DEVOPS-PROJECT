version: '3.8'

services:
  mongo:
    environment:
      - MONGO_INITDB_DATABASE=secure-file-transfer

  backend:
    build: ./backend
    container_name: sft-backend-dev
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/secure-file-transfer
      - JWT_SECRET=supersecretjwtkey2024securetransfer
      - JWT_EXPIRE=24h
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads-data:/app/uploads
    command: npx nodemon server.js
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sft-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sft-frontend-dev
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - sft-network
    restart: unless-stopped

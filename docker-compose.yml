

services:
  mongo:
    image: mongo:6
    container_name: sft-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - sft-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: sft-backend
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/secure-file-transfer
      - JWT_EXPIRE=24h
      - NODE_ENV=production
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sft-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sft-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sft-network
    restart: unless-stopped

volumes:
  mongo-data:
  uploads-data:

networks:
  sft-network:
    driver: bridge

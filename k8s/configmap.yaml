apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: secure-file-transfer
  labels:
    app: backend
data:
  PORT: "5000"
  MONGO_URI: "mongodb://mongo:27017/secure-file-transfer"
  JWT_EXPIRE: "24h"
  NODE_ENV: "production"
  UPLOAD_DIR: "./uploads"
  MAX_FILE_SIZE: "52428800"
  CLIENT_URL: "http://localhost"